<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading invitation…</title>
</head>
<body>
  <script>
    const segments = location.pathname.split('/').filter(Boolean);
    const base = location.hostname.endsWith('github.io') && segments.length ? `/${segments[0]}/` : '/';
    fetch(`${base}index.html`)
      .then((response) => {
        if (!response.ok) throw new Error('Could not load the invitation.');
        return response.text();
      })
      .then((html) => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.textContent = 'The invitation could not be loaded. Please try again later.';
      });
  </script>
</body>
</html>
